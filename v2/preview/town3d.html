<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Náhľad: mesto zhora</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7cc8ff; font-family: system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  .bar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; pointer-events: none; }
  .bar button, .bar a, .bar span { pointer-events: auto; min-width: 56px; height: 56px; padding: 0 12px; display: grid; place-items: center; border: 0; border-radius: 18px;
    background: rgba(255, 255, 255, .9); color: #23324a; font: 800 16px system-ui; text-decoration: none; box-shadow: 0 3px 8px rgba(0, 0, 0, .3); cursor: pointer; }
  .bar .on { background: #ffd23f; outline: 3px solid #fff; }
  .bar .emo { font-size: 26px; }
  .bar .coins { font-size: 22px; }
  .pad { position: fixed; right: 16px; bottom: 16px; display: grid; grid-template-areas: ". u ." "l . r" ". d ."; grid-template-columns: repeat(3, 72px); grid-template-rows: repeat(3, 72px); gap: 6px; }
  .pad button { border: 0; border-radius: 22px; background: rgba(255, 255, 255, .9); font-size: 34px; box-shadow: 0 3px 8px rgba(0, 0, 0, .3); touch-action: none; }
  .pad .u { grid-area: u; } .pad .d { grid-area: d; } .pad .l { grid-area: l; } .pad .r { grid-area: r; }
  @media (max-width: 600px) { .pad { grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); right: 50%; transform: translateX(50%); } }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="stage"></div>
<div class="bar" id="bar"></div>
<div class="pad" id="pad"></div>
<script type="module">
// Town preview (DESIGN-v2 §14, part 16, the parent's idea): the town seen from above or from a
// slight angle, streets in a grid, the child drives up, down, left and right and picks up the
// coins its buildings made. Buildings are simple low-poly blocks (City Kit models can replace them).
import "../js/core/state.js";
import * as THREE from "three";
import { GLTFLoader } from "./vendor/addons/loaders/GLTFLoader.js";
import { BUILDINGS } from "../js/data/city.js";

const N = 4; // blocks per side
const BLOCK = 4; // block size
const ROAD = 1.6; // road width
const STEP = BLOCK + ROAD; // distance between crossings
const ORIGIN = -((N * STEP) / 2) + ROAD / 2; // first crossing
const node = (i) => ORIGIN + i * STEP; // crossing i → world coordinate
const LEVELS = [2, 3, 1, 1, 2, 0, 1, 0, 0, 0, -1, -1, 0, 1, -1, 0]; // sample town (-1 locked, 0 for sale)

let night = new Date().getHours() >= 19 || new Date().getHours() < 7;
let view = "angle";
let coins = 0;

// ---------- scene ----------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.append(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
const hemi = new THREE.HemisphereLight("#e6eeff", "#5a7a4a", 1.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight("#ffffff", 2.2);
sun.position.set(10, 20, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, far: 60 });
scene.add(sun);

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...extra });
const size = N * STEP + ROAD;
const grass = new THREE.Mesh(new THREE.PlaneGeometry(size + 20, size + 20), mat("#7ccf5a"));
grass.rotation.x = -Math.PI / 2;
grass.receiveShadow = true;
scene.add(grass);
// roads with dashed middle lines
const roadMat = mat("#5e636c");
const lineMat = mat("#ffffff");
for (let i = 0; i <= N; i++) {
  for (const along of ["x", "z"]) {
    const r = new THREE.Mesh(new THREE.PlaneGeometry(along === "x" ? size : ROAD, along === "x" ? ROAD : size), roadMat);
    r.rotation.x = -Math.PI / 2;
    r.position.set(along === "x" ? 0 : node(i), 0.01, along === "x" ? node(i) : 0);
    r.receiveShadow = true;
    scene.add(r);
    for (let d = -size / 2 + 0.6; d < size / 2; d += 1.2) {
      if (Array.from({ length: N + 1 }, (_, k) => node(k)).some((c) => Math.abs(c - d) < ROAD / 2 + 0.2)) continue;
      const l = new THREE.Mesh(new THREE.PlaneGeometry(along === "x" ? 0.5 : 0.08, along === "x" ? 0.08 : 0.5), lineMat);
      l.rotation.x = -Math.PI / 2;
      l.position.set(along === "x" ? d : node(i), 0.02, along === "x" ? node(i) : d);
      scene.add(l);
    }
  }
}

function emojiTex(char, bg = null) {
  const cv = document.createElement("canvas");
  cv.width = cv.height = 128;
  const g = cv.getContext("2d");
  if (bg) {
    g.fillStyle = bg;
    g.beginPath();
    g.roundRect(4, 4, 120, 120, 24);
    g.fill();
  }
  g.font = '92px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(char, 64, 70);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ---------- buildings ----------
const lit = [];
const plots = [];
const coinMeshes = [];
const coinGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.08, 24);
const coinMat = mat("#ffc93c", { metalness: 0.6, roughness: 0.3, emissive: "#6b4a00", emissiveIntensity: 0.3 });
function building(b, level, cx, cz) {
  const g = new THREE.Group();
  g.position.set(cx, 0, cz);
  scene.add(g);
  if (level < 0) {
    const pad = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 3), mat("#b9c0c9"));
    pad.position.y = 0.05;
    g.add(pad);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: emojiTex("🔒") }));
    s.scale.set(1.2, 1.2, 1);
    s.position.y = 1;
    g.add(s);
    return g;
  }
  if (level === 0) {
    const pad = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.12, 3.2), mat("#d9b98a"));
    pad.position.y = 0.06;
    g.add(pad);
    for (const [x, z, w, d] of [[0, -1.6, 3.2, 0.08], [0, 1.6, 3.2, 0.08], [-1.6, 0, 0.08, 3.2], [1.6, 0, 0.08, 3.2]]) {
      const f = new THREE.Mesh(new THREE.BoxGeometry(w, 0.5, d), mat("#ffd23f"));
      f.position.set(x, 0.3, z);
      g.add(f);
    }
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: emojiTex(b.icon, "rgba(255,255,255,.85)") }));
    s.scale.set(1.3, 1.3, 1);
    s.position.y = 1.2;
    g.add(s);
    return g;
  }
  const h = 1.2 + level * 0.9;
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.8, h, 2.8), mat(b.color));
  body.position.y = h / 2;
  body.castShadow = body.receiveShadow = true;
  g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.2, 1, 4), mat(new THREE.Color(b.color).multiplyScalar(0.55)));
  roof.position.y = h + 0.5;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  g.add(roof);
  // windows on all four sides (lit at night)
  for (let side = 0; side < 4; side++) {
    for (let fl = 0; fl < level + 1; fl++) {
      for (const k of [-0.7, 0.7]) {
        const wmat = new THREE.MeshStandardMaterial({ color: "#dff3ff", emissive: "#ffd86b", emissiveIntensity: 0 });
        lit.push(wmat);
        const w = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.45), wmat);
        const a = (side * Math.PI) / 2;
        w.position.set(Math.sin(a) * 1.41 + Math.cos(a) * k, 0.7 + fl * 0.85, Math.cos(a) * 1.41 - Math.sin(a) * k);
        w.rotation.y = a;
        g.add(w);
      }
    }
  }
  const sign = new THREE.Sprite(new THREE.SpriteMaterial({ map: emojiTex(b.icon, "#ffffff") }));
  sign.scale.set(1.1, 1.1, 1);
  sign.position.y = h + 1.5;
  g.add(sign);
  return g;
}
// blocks nearest to the middle get the first (cheapest) buildings; the rest are little parks
const blocks = Array.from({ length: N * N }, (_, k) => [k % N, Math.floor(k / N)]).sort((a, b) => Math.hypot(a[0] - 1.5, a[1] - 1.5) - Math.hypot(b[0] - 1.5, b[1] - 1.5));
blocks.slice(BUILDINGS.length).forEach(([bx, bz]) => {
  for (let k = 0; k < 4; k++) {
    const t = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 0.6), mat("#7a5230"));
    trunk.position.y = 0.3;
    const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(0.6, 0), mat(k % 2 ? "#3aa04a" : "#58c466", { flatShading: true }));
    crown.position.y = 1;
    t.add(trunk, crown);
    t.position.set(node(bx) + STEP / 2 + (k % 2 ? 0.9 : -0.9), 0, node(bz) + STEP / 2 + (k < 2 ? 0.9 : -0.9));
    t.traverse((m) => m.isMesh && (m.castShadow = true));
    scene.add(t);
  }
});
BUILDINGS.slice(0, N * N).forEach((b, i) => {
  const [bx, bz] = blocks[i];
  const cx = node(bx) + STEP / 2;
  const cz = node(bz) + STEP / 2;
  const level = LEVELS[i] ?? 0;
  const g = building(b, level, cx, cz);
  plots.push({ b, level, g, cx, cz });
  if (level > 0) {
    // the rent waits as coins on the road below the building
    for (let k = 0; k < level + 1; k++) {
      const c = new THREE.Mesh(coinGeo, coinMat);
      c.rotation.x = Math.PI / 2;
      c.position.set(cx - 1.2 + k * 0.8, 0.5, node(bz + 1));
      c.castShadow = true;
      scene.add(c);
      coinMeshes.push(c);
    }
  }
});
// trees on the free corners of the grass
for (let i = 0; i < 30; i++) {
  const x = (Math.random() - 0.5) * (size + 14);
  const z = (Math.random() - 0.5) * (size + 14);
  if (Math.abs(x) < size / 2 + 1 && Math.abs(z) < size / 2 + 1) continue;
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 0.6), mat("#7a5230"));
  trunk.position.y = 0.3;
  const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(0.6, 0), mat("#3aa04a", { flatShading: true }));
  crown.position.y = 1;
  t.add(trunk, crown);
  t.position.set(x, 0, z);
  t.traverse((m) => m.isMesh && (m.castShadow = true));
  scene.add(t);
}

// ---------- the car: drives on the street grid ----------
const car = { gx: 2, gz: 2, x: node(2), z: node(2), dir: null, next: null, heading: 0, mesh: new THREE.Group() };
scene.add(car.mesh);
new GLTFLoader().load("./models/carkit/sedan.glb", (gltf) => {
  const m = gltf.scene;
  const s = new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3());
  m.scale.setScalar(1.5 / Math.max(s.x, s.z));
  m.traverse((o) => o.isMesh && (o.castShadow = true));
  car.mesh.add(m);
});
const DIRS = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };
const canGo = (dir, gx = car.gx, gz = car.gz) => {
  const [dx, dz] = DIRS[dir];
  return gx + dx >= 0 && gx + dx <= N && gz + dz >= 0 && gz + dz <= N;
};
function press(dir) {
  if (car.dir) car.next = dir; // remembered for the next crossing
  else if (canGo(dir)) car.dir = dir;
}
function update(dt) {
  const speed = 5.5;
  if (car.dir) {
    const [dx, dz] = DIRS[car.dir];
    const tx = node(car.gx + dx);
    const tz = node(car.gz + dz);
    car.x += dx * speed * dt;
    car.z += dz * speed * dt;
    car.heading = Math.atan2(dx, dz);
    if ((dx && (tx - car.x) * dx <= 0) || (dz && (tz - car.z) * dz <= 0)) {
      car.gx += dx;
      car.gz += dz;
      car.x = node(car.gx);
      car.z = node(car.gz);
      // keep going straight, or turn as asked; stop at the edge or with nothing asked
      const want = car.next && canGo(car.next) ? car.next : null;
      car.next = null;
      car.dir = want || (canGo(car.dir) && hold ? car.dir : null);
    }
  }
  const lane = 0.4; // drive on the right side of the road
  const [hx, hz] = car.dir ? DIRS[car.dir] : [Math.sin(car.heading), Math.cos(car.heading)];
  car.mesh.position.set(car.x - hz * lane, 0, car.z + hx * lane);
  const cur = car.mesh.rotation.y;
  let d = car.heading - cur;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  car.mesh.rotation.y = cur + d * Math.min(1, dt * 10);
  // coins
  for (const c of coinMeshes) {
    if (!c.visible) continue;
    c.rotation.z += dt * 3;
    if (c.position.distanceTo(car.mesh.position) < 1) {
      c.visible = false;
      coins++;
      ui();
      try {
        const ac = (window.__ac ||= new AudioContext());
        const o = ac.createOscillator();
        const gn = ac.createGain();
        o.frequency.value = 988 + (coins % 4) * 120;
        gn.gain.setValueAtTime(0.1, ac.currentTime);
        gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);
        o.connect(gn).connect(ac.destination);
        o.start();
        o.stop(ac.currentTime + 0.15);
      } catch { /* no sound */ }
    }
  }
}

// ---------- camera, light, input ----------
let hold = false;
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();
function frameCamera(dt) {
  const far = innerWidth < innerHeight ? 1.5 : 1;
  const offs = view === "top" ? [0, 27, 5] : [0, 17, 13];
  const target = new THREE.Vector3(car.mesh.position.x + offs[0] * far, offs[1] * far, car.mesh.position.z + offs[2] * far);
  camera.position.lerp(target, Math.min(1, dt * 3));
  camera.lookAt(car.mesh.position.x, 0, car.mesh.position.z - (view === "top" ? 0 : 1));
}
function applyLight() {
  scene.background = new THREE.Color(night ? "#141838" : "#9be3f0");
  hemi.intensity = night ? 0.45 : 1.6;
  sun.intensity = night ? 0.25 : 2.2;
  for (const m of lit) m.emissiveIntensity = night ? 1.2 : 0;
}
applyLight();
const pad = document.getElementById("pad");
for (const [dir, icon] of [["u", "⬆️"], ["l", "⬅️"], ["r", "➡️"], ["d", "⬇️"]]) {
  const b = document.createElement("button");
  b.className = dir;
  b.textContent = icon;
  b.onpointerdown = () => ((hold = true), press(dir));
  b.onpointerup = b.onpointerleave = () => (hold = false);
  pad.append(b);
}
addEventListener("keydown", (e) => {
  const dir = { ArrowUp: "u", ArrowDown: "d", ArrowLeft: "l", ArrowRight: "r" }[e.key];
  if (dir) {
    hold = true;
    press(dir);
  }
});
addEventListener("keyup", () => (hold = false));
let swipe = null;
stage.addEventListener("pointerdown", (e) => (swipe = { x: e.clientX, y: e.clientY }));
addEventListener("pointerup", (e) => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x;
  const dy = e.clientY - swipe.y;
  swipe = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
  press(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "r" : "l") : dy > 0 ? "d" : "u");
});
const bar = document.getElementById("bar");
function ui() {
  const b = (label, on, fn, cls = "") => Object.assign(document.createElement("button"), { textContent: label, className: `${on ? "on " : ""}${cls}`, onclick: () => (fn(), ui()) });
  const home = Object.assign(document.createElement("a"), { href: "../", textContent: "🏠", className: "emo" });
  const c = Object.assign(document.createElement("span"), { textContent: `🪙 ${coins}`, className: "coins" });
  bar.replaceChildren(home, b("Z uhla", view === "angle", () => (view = "angle")), b("Zhora", view === "top", () => (view = "top")), b(night ? "🌙" : "☀️", false, () => ((night = !night), applyLight()), "emo"), c);
}
ui();
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  frameCamera(dt);
  renderer.render(scene, camera);
});
window.__preview = { press, setView: (v) => ((view = v), ui()), setNight: (n) => ((night = n), applyLight(), ui()), state: () => ({ gx: car.gx, gz: car.gz, coins }) };
</script>
</body>
</html>
