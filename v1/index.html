<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe4ff">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Autíčkové mesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen toy app. Chunky stat bar on top, scrolling view in the middle, toy-block tab bar at the bottom; games take over the whole stage. Single bright look on purpose (a kids' toy world), colors set explicitly. */
:root{
  --sky:#bfe4ff; --sky2:#eaf6ff; --ink:#15314d; --muted:#48678a;
  --card:#ffffff; --edge:#a9cbe8; --edgeD:#86afd4;
  --sun:#ffc533; --sunD:#d99a00;
  --grass:#2fb257; --grassD:#1f8a41;
  --tomato:#ff5a4a; --tomatoD:#cf3627;
  --plum:#7b5cff; --plumD:#5536d6;
  --blue:#3a86ff; --blueD:#1f62d1;
  --orange:#ff8c1a; --orangeD:#cc6a00;
  --road:#3b4453; --gold:#ffe28a;
  --onsky:#15314d; --onsky2:#48678a;
  --f:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --emo:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:linear-gradient(180deg,var(--sky),var(--sky2) 75%);color:var(--ink);font-family:var(--f);font-size:18px;line-height:1.3;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
#app{height:100%;max-width:980px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column}
h1,h2{margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:1.45rem;font-weight:800;margin-block:18px 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;color:var(--onsky)}
h2 small{font-size:1rem;color:var(--onsky2)}
.mbox h2,.mbox h2 small{color:var(--ink)}
.street{overflow-x:auto;overflow-y:hidden;border-radius:24px;border-bottom:6px solid var(--edge);background:var(--card);-webkit-overflow-scrolling:touch}
.street canvas{display:block;cursor:pointer}
.fcoin{position:fixed;z-index:35;font-family:var(--emo);font-size:1.5rem;pointer-events:none}
.bigE.opening{animation:openBox 1s ease-out}
@keyframes openBox{0%{transform:scale(.6)}20%{transform:rotate(-12deg) scale(1)}35%{transform:rotate(12deg)}50%{transform:rotate(-8deg)}65%{transform:rotate(0) scale(1.35)}100%{transform:scale(1)}}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;padding-block:10px 8px}
.lvl{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 12px 4px 4px;border-bottom:4px solid var(--edge);flex:1;min-width:0;max-width:220px}
.lvlN{width:38px;height:38px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.2rem;flex:none}
.xp{flex:1;height:12px;border-radius:99px;background:#e6eef7;overflow:hidden}
.xp i,.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--orange));border-radius:99px;transition:width .4s}
.pill{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:6px 12px;border-bottom:4px solid var(--edge);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{font-size:1.1rem}
.pill.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.15)}}
.gear{font-size:1.5rem;width:46px;height:46px;border-radius:50%;background:var(--card);border-bottom:4px solid var(--edge);flex:none;font-family:var(--emo)}

#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:16px;-webkit-overflow-scrolling:touch;min-height:0}
#view.gameview{display:flex;flex-direction:column;overflow:hidden;padding-bottom:8px}
#view.gameview.scroll{overflow-y:auto}

/* bottom nav */
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding-block:8px calc(10px + env(safe-area-inset-bottom,0px))}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;font-size:1.7rem;font-family:var(--emo);background:var(--card);border-radius:18px;padding:6px 0 4px;border-bottom:5px solid var(--edge)}
.nav button span{font-family:var(--f);font-size:.85rem;font-weight:800}
.nav button.on{background:var(--sun);border-color:var(--sunD)}
.nav button .dot{position:absolute;top:4px;right:16%;width:14px;height:14px;border-radius:50%;background:var(--tomato);border:2px solid #fff}

/* buttons */
.btn{--c:var(--card);--cd:var(--edge);background:var(--c);border-bottom:5px solid var(--cd);border-radius:16px;padding:.5em 1em;font-weight:800;font-size:1.05rem;transition:transform .06s;white-space:nowrap}
.btn:active{transform:translateY(3px);border-bottom-width:2px;margin-top:3px}
.btn.sm{font-size:.95rem;padding:.35em .8em;border-radius:12px;border-bottom-width:4px}
.btn.sun{--c:var(--sun);--cd:var(--sunD)}
.btn.grass{--c:var(--grass);--cd:var(--grassD);color:#fff}
.btn.plum{--c:var(--plum);--cd:var(--plumD);color:#fff}
.btn.tomato{--c:var(--tomato);--cd:var(--tomatoD);color:#fff}
.btn.ghost{--c:var(--card);--cd:var(--edge)}
.btn.poor{filter:saturate(.3);opacity:.7}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* games tab */
.hello{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:12px 14px;margin-top:6px;border-bottom:6px solid var(--edge)}
.mycar{width:118px;flex:none;animation:drive 2.4s ease-in-out infinite}
.carsvg{display:block;width:100%;height:auto}
.isvg{display:block;width:100%;max-width:150px}
.bigsvg{width:220px;max-width:100%;margin:0 auto}
.tprev{display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,var(--card) 70%,#dfe9f3 70%);border-radius:24px;padding:12px;margin-top:12px;border-bottom:6px solid var(--edge)}
.tprev svg{max-width:340px}
.tprev b{font-size:1.2rem}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border-radius:16px;padding:8px 4px;border-bottom:4px solid var(--edge);font-weight:700;font-size:.9rem;line-height:1.1}
.opt.on{background:#fff7d6;box-shadow:0 0 0 3px var(--sun)}
.opt small{color:var(--muted);font-weight:800}
.opt.poor{opacity:.65}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);display:block}
.wsv{width:36px;height:36px}
.oe{font-family:var(--emo);font-size:1.6rem;line-height:1.3}
.tracks{display:grid;gap:12px}
.track{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;text-align:left;color:#fff;background:linear-gradient(90deg,var(--tg) 0 12%,var(--te) 12% 13%,var(--tr) 13% 87%,var(--te) 87% 88%,var(--tg) 88%);border-bottom:6px solid rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.track:active{transform:translateY(3px)}
.track.tlock{filter:saturate(.45)}
.te{font-family:var(--emo);font-size:2.4rem;width:56px;height:56px;display:grid;place-items:center;background:rgba(255,255,255,.9);border-radius:50%;flex:none;text-shadow:none}
.tn{flex:1;min-width:0;display:flex;flex-direction:column}
.tn b{font-size:1.4rem}
.tn small{font-weight:700;opacity:.9}
.tb{display:flex;align-items:center;gap:6px;font-weight:800;white-space:nowrap}
.medal{font-family:var(--emo);font-size:1.6rem}
.go{background:var(--sun);color:var(--ink);text-shadow:none;border-radius:12px;padding:4px 10px}
.place{display:flex;align-items:center;justify-content:center;gap:10px}
.place svg{width:130px}
.place b{display:block;font-size:1.6rem}
.place span{font-family:var(--emo);font-size:2.4rem}
@keyframes drive{50%{transform:translateX(-6px) rotate(-3deg)}}
.hello h1{font-size:1.5rem}
.hello p{margin:2px 0 0;color:var(--muted);font-size:1rem}
.hello>div{flex:1;min-width:0}
.say{font-family:var(--emo);font-size:1.5rem;width:48px;height:48px;border-radius:50%;background:var(--sky2);flex:none}
.quests{display:grid;gap:10px}
.quest{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 12px;border-bottom:5px solid var(--edge)}
.quest.done{background:#fff7d6;border-color:var(--sunD)}
.qe{font-family:var(--emo);font-size:2rem}
.qb{flex:1;min-width:0}
.qt{font-weight:700;font-size:1rem}
.qt b{color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:12px;border-radius:99px;background:#e6eef7;overflow:hidden;margin-top:4px}
.qr{font-weight:800;color:var(--muted);white-space:nowrap}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.game{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1/0.9;max-width:100%;border-radius:24px;background:var(--c);border-bottom:7px solid var(--cd);color:var(--tc,#fff)}
.game:active{transform:translateY(4px);border-bottom-width:3px}
.ge{font-family:var(--emo);font-size:3.2rem;line-height:1}
.gn{font-weight:800;font-size:1.25rem}
.game.locked{filter:grayscale(.85);opacity:.65}
.lock{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.35);color:#fff;border-radius:99px;padding:0 8px;font-size:.9rem;font-weight:800}

/* city */
.banner{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:22px;padding:12px 16px;margin-top:8px;font-size:1.05rem;color:#fff;animation:pulse 1.6s ease-in-out infinite}
.banner.gift{background:var(--tomato);border-bottom:6px solid var(--tomatoD)}
.banner.chest{background:var(--plum);border-bottom:6px solid var(--plumD)}
.banner b{font-size:1.25rem}
.banner .be{font-family:var(--emo);font-size:2.8rem;line-height:1}
@keyframes pulse{50%{transform:scale(1.02)}}
.chestprog{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:10px 14px;margin-top:8px;font-weight:700;border-bottom:5px solid var(--edge);flex-wrap:wrap}
.chestprog .prog{flex:1;min-width:80px;margin:0}
.city{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;background:linear-gradient(180deg,transparent 0 62%,#9fd98a 62%);border-radius:24px;padding:4px}
.bld{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border-radius:22px;padding:10px 8px 12px;border-bottom:6px solid var(--edge);text-align:center}
.bld.empty{background:rgba(255,255,255,.7);border:3px dashed var(--edgeD);border-bottom-width:3px}
.bld.locked{opacity:.6}
.bcol{display:flex;flex-direction:column;align-items:center;width:100%;border-radius:16px;padding:4px}
.bcol:active{transform:scale(.95)}
.be{font-family:var(--emo);font-size:3rem;line-height:1.1}
.bstore{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.05rem}
.fill{display:block;width:80%;height:8px;border-radius:99px;background:#e6eef7;overflow:hidden}
.fill i{display:block;height:100%;width:0;background:var(--grass);border-radius:99px}
.bn{font-weight:800;line-height:1.1}
.bn small{color:var(--muted);font-weight:700}
.bsub{font-size:.85rem;color:var(--muted);font-weight:700}

/* shop + album */
.seg{display:flex;gap:8px;margin-top:8px}
.seg button{flex:1;padding:10px;border-radius:16px;background:var(--card);border-bottom:5px solid var(--edge);font-weight:800}
.seg button.on{background:var(--sun);border-color:var(--sunD)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.item{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;background:var(--card);border-radius:22px;padding:12px 8px;border-bottom:6px solid var(--edge)}
.item.sel{background:#fff7d6;border-color:var(--sunD)}
.ie{font-family:var(--emo);font-size:3rem;line-height:1.1}
.item small,.pack small{color:var(--muted);font-weight:700;font-size:.85rem;line-height:1.15;min-height:2.3em}
.bld .btn,.item .btn{white-space:normal;max-width:100%}
.tag{font-weight:800;color:var(--grassD);padding:.35em 0}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:#dbe6f1}
.dots i.on{background:var(--sun);box-shadow:0 0 0 2px var(--sunD) inset}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.pack{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border-radius:22px;padding:12px 8px;border-bottom:6px solid var(--edge)}
.pack.gold{background:var(--gold);border-color:var(--sunD)}
.pack:active{transform:translateY(3px)}
.page{background:var(--card);border-radius:22px;padding:12px;margin-bottom:12px;border-bottom:6px solid var(--edge)}
.ph{display:flex;justify-content:space-between;font-size:1.15rem;margin-bottom:8px}
.ph span{font-weight:800;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.slot{position:relative;aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:16px;background:#eef4fa;border:3px dashed #c9d9ea;font-size:1.6rem;font-weight:800;color:#b6c8dc}
.slot.gold{border-color:var(--sun)}
.slot.got{font-family:var(--emo);font-size:2.4rem;background:#fff;border:3px solid var(--edge);color:var(--ink)}
.slot.got.gold{background:var(--gold);border-color:var(--sunD)}
.slot small{position:absolute;right:4px;bottom:0;font-family:var(--f);font-size:.8rem;font-weight:800}

/* modal */
#modal{position:fixed;inset:0;background:rgba(21,49,77,.55);display:grid;place-items:center;padding:16px;z-index:20}
.mbox{background:var(--card);border-radius:28px;padding:22px 18px;width:min(420px,100%);max-height:90%;overflow:auto;text-align:center;border-bottom:8px solid var(--edge);animation:pop .3s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.mbox h2{justify-content:center;font-size:1.8rem;margin:6px 0}
.mbox p{margin:6px 0;color:var(--muted);font-weight:600}
.mrow{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.rstars{font-family:var(--emo);font-size:3rem;display:flex;justify-content:center;gap:6px}
.rstars span{filter:grayscale(1) opacity(.3)}
.rstars span.on{filter:none;animation:pop .4s backwards}
.rstars span:nth-child(2){animation-delay:.15s;transform:translateY(-10px)}
.rstars span:nth-child(3){animation-delay:.3s}
.rcoins{font-size:2rem;font-weight:800;color:var(--sunD)}
.bigE{font-family:var(--emo);font-size:5rem;line-height:1.1}
.lvlBig{width:96px;height:96px;margin:0 auto;border-radius:50%;background:var(--plum);color:#fff;font-size:3rem;font-weight:800;display:grid;place-items:center;border-bottom:6px solid var(--plumD)}
.unl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.unl span{background:var(--sky2);border-radius:12px;padding:4px 10px;font-weight:800}
.set{display:grid;gap:10px}
.small{font-size:.85rem}
.reveal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.rv{width:84px;display:flex;flex-direction:column;align-items:center;background:var(--sky2);border-radius:16px;padding:8px 4px;animation:flipin .5s var(--d) backwards}
.rv span{font-family:var(--emo);font-size:2.6rem;line-height:1.1}
.rv small{font-weight:800;font-size:.8rem;color:var(--muted)}
.rv.new small{color:var(--grassD)}
.rv.gold{background:var(--gold)}
@keyframes flipin{from{transform:rotateY(90deg) scale(.5);opacity:0}}

/* toasts and effects */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;font-weight:700;z-index:30;animation:pop .25s;max-width:calc(100% - 32px);text-align:center}
.float{position:fixed;z-index:30;font-weight:800;font-size:1.4rem;color:var(--sunD);text-shadow:0 2px 0 #fff;pointer-events:none;transform:translate(-50%,-50%);animation:rise 1s forwards;white-space:nowrap}
@keyframes rise{to{transform:translate(-50%,-140%);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}

/* game shell */
.ghead{display:flex;align-items:center;gap:8px;padding-block:6px 10px;flex-wrap:wrap}
.ghead .back{font-size:1.2rem;width:48px;height:48px;padding:0;border-radius:50%}
.gtitle{font-size:1.4rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gstat{background:var(--card);border-radius:99px;padding:4px 12px;font-weight:800;font-variant-numeric:tabular-nums;border-bottom:4px solid var(--edge);white-space:nowrap}
.stage{position:relative;flex:1;min-height:280px;border-radius:24px;overflow:hidden;touch-action:none}
.stage canvas{display:block}
.hint{text-align:center;font-weight:700;color:var(--onsky2);margin:8px 0 0}
.choose{display:grid;gap:12px;max-width:420px;width:100%;margin:10px auto 0}
.choose p{text-align:center;font-weight:800;font-size:1.2rem;margin:0;color:var(--onsky)}
.choice{display:flex;align-items:center;gap:12px;text-align:left;font-size:1.3rem;padding:.7em 1em;white-space:normal}
.choice small{display:block;font-size:.9rem;color:var(--muted)}
.ce{font-family:var(--emo);font-size:2.4rem}

/* race */
.tap{position:absolute;bottom:12px;font-size:1.6rem;color:rgba(255,255,255,.55);pointer-events:none;font-weight:800}
.tapL{left:12px}.tapR{right:12px}

/* pexeso */
.pgrid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px;max-width:min(520px,100%);width:100%;margin:0 auto;perspective:800px}
.card{position:relative;aspect-ratio:3/4;max-width:100%;transform-style:preserve-3d;transition:transform .35s}
.card span{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .back{background:repeating-linear-gradient(45deg,var(--plum) 0 10px,#8d73ff 10px 20px);color:#fff;font-size:2rem;font-weight:800;border-bottom:5px solid var(--plumD)}
.card .face{background:#fff;font-family:var(--emo);font-size:clamp(1.8rem,9vw,3rem);transform:rotateY(180deg);border-bottom:5px solid var(--edge)}
.card.flip{transform:rotateY(180deg)}
.card.ok .face{background:#e2f8e8;border-color:var(--grass);animation:pop .35s}

/* wash */
.stage.wash{background:repeating-conic-gradient(#d8eefc 0 25%,#c4e3f8 0 50%) 0 0/44px 44px}
.stage.wash canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.bubble{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,.4) 40%,rgba(160,210,255,.35));border:2px solid rgba(255,255,255,.9);pointer-events:none;animation:bub .9s forwards}
@keyframes bub{to{transform:translateY(-60px) scale(1.4);opacity:0}}

/* count */
.count{flex:1;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0}
.scene{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:var(--card);border-radius:24px;padding:16px;border-bottom:6px solid var(--edge);min-height:160px}
.grp{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%;font-family:var(--emo);font-size:2.4rem;line-height:1}
.grp.small{max-width:40%;font-size:2rem}
.grp span{animation:pop .3s backwards}
.plus{font-size:3rem;font-weight:800;color:var(--plum)}
.ans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.num{font-size:2.6rem;padding:.2em 0;border-radius:20px}
.num.right{--c:var(--grass);--cd:var(--grassD);color:#fff}
.num.wrong{--c:var(--tomato);--cd:var(--tomatoD);color:#fff}

/* puzzle */
.pz{display:flex;flex-direction:column;align-items:center;gap:14px}
.board{position:relative;display:grid;grid-template-columns:repeat(var(--n),var(--ts));grid-auto-rows:var(--ts);border-radius:14px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 0 var(--edge)}
.pzghost{position:absolute;inset:0;background-image:var(--img);background-size:cover;opacity:.22;pointer-events:none}
.cell{position:relative;border:1px dashed rgba(21,49,77,.25)}
.cell.placed{border:0;background-image:var(--img);background-size:calc(var(--n)*100%) calc(var(--n)*100%);animation:pop .3s}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:100%}
.tile{width:var(--ts);height:var(--ts);max-width:100%;border-radius:10px;background-image:var(--img);background-size:calc(var(--n)*100%) calc(var(--n)*100%);border:3px solid #fff;box-shadow:0 4px 0 var(--edge)}
.tile.sel{border-color:var(--sun);box-shadow:0 0 0 4px var(--sun);transform:translateY(-4px) scale(1.05)}

/* parking */
.park{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto}
.lot{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;background:var(--road);border-radius:22px;padding:14px}
.spot{position:relative;height:96px;border-radius:12px;border:5px dashed var(--sc);background:rgba(255,255,255,.08);display:grid;place-items:center}
.spot .dots6{color:#fff;font-size:1.3rem;letter-spacing:2px;max-width:70px;line-height:1.1;word-break:break-all}
.spot svg{width:88%;animation:pop .3s}
.spot.full{border-style:solid}
.queue{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pcar{width:110px;max-width:30%;padding:6px;border-radius:16px;background:var(--card);border-bottom:5px solid var(--edge)}
.pcar.sel{background:#fff7d6;box-shadow:0 0 0 4px var(--sun);transform:translateY(-4px)}
.pcar svg{display:block;width:100%}


/* new activities */
.repair{display:flex;flex-direction:column;align-items:center;gap:12px}
.rcar{position:relative;width:min(420px,100%);background:var(--card);border-radius:24px;padding:18px 12px 8px;border-bottom:6px solid var(--edge)}
.rcar.driveoff svg{animation:driveoff 1.4s ease-in forwards}
@keyframes driveoff{20%{transform:translateX(-10px)}100%{transform:translateX(130%)}}
.mark{position:absolute;transform:translate(-50%,-60%);font-family:var(--emo);font-size:1.9rem;animation:pulse 1s infinite;pointer-events:none;margin-left:12px;margin-top:18px}
.mark i{position:absolute;top:-8px;right:-12px;font-style:normal;font-family:var(--f);font-weight:800;font-size:.9rem;background:var(--tomato);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.mark.fixed{animation:pop .4s}
.rq{font-weight:800;font-size:1.25rem;text-align:center;margin:0;color:var(--onsky)}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(420px,100%)}
.tool{aspect-ratio:1;max-width:100%;font-family:var(--emo);font-size:2.4rem;background:var(--card);border-radius:20px;border-bottom:5px solid var(--edge);display:grid;place-items:center}
.tool.use{background:#e2f8e8;animation:pop .4s}
.tiresvg{width:2.6rem;height:2.6rem}
.mazewrap{display:flex;justify-content:center}
.mazewrap canvas{border-radius:16px;border:4px solid #fff;box-shadow:0 6px 0 var(--edge);touch-action:none}
.pad{display:grid;grid-template-columns:repeat(4,64px);gap:8px;justify-content:center;margin-top:12px}
.pad .btn{font-family:var(--emo);font-size:1.6rem;padding:.25em 0}
.letters{display:flex;flex-direction:column;align-items:center;gap:14px}
.train{display:flex;align-items:flex-end;gap:4px;animation:trainin .8s ease-out}
.train.go{animation:trainout 1.2s ease-in forwards}
@keyframes trainin{from{transform:translateX(-120%)}}
@keyframes trainout{to{transform:translateX(160%)}}
.loco{font-family:var(--emo);font-size:4rem;line-height:1;transform:scaleX(-1)}
.wagon{width:86px;height:76px;display:grid;place-items:center;background:var(--tomato);color:#fff;font-size:3.2rem;font-weight:800;border-radius:12px;border-bottom:8px solid var(--road);box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.lq{font-size:1.4rem;font-weight:800;margin:0;text-align:center;color:var(--onsky)}
.lq b{color:var(--tomato);font-size:1.8rem}
.lq .blank{display:inline-block;min-width:1.2em;border-bottom:4px dashed var(--tomato)}
.lq .blank.ok{border-bottom-style:solid;animation:pop .4s}
.bigpic{font-family:var(--emo);font-size:5.5rem;line-height:1.1;background:var(--card);border-radius:28px;padding:10px 26px;border-bottom:6px solid var(--edge)}
.lopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(440px,100%)}
.lopt{display:flex;flex-direction:column;align-items:center;background:var(--card);border-radius:22px;padding:12px 4px 8px;border-bottom:6px solid var(--edge)}
.lopt span{font-family:var(--emo);font-size:3.2rem;line-height:1.1}
.lopt.let span{font-family:var(--f);font-weight:800;font-size:3rem}
.lopt small{min-height:1.3em;font-weight:800;letter-spacing:.05em}
.lopt small em{font-style:normal;color:var(--tomato)}
.lopt.right{background:#e2f8e8;border-color:var(--grass)}
.lopt.wrong{background:#ffe3e0;border-color:var(--tomato)}
.music{display:flex;flex-direction:column;align-items:center;gap:14px}
.mcars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(420px,100%)}
.mcar{background:var(--card);border-radius:24px;padding:16px 10px;border-bottom:6px solid var(--edge);transition:transform .1s}
.mcar svg{display:block;width:100%}
.mcar.on{background:var(--mc);transform:scale(1.08);box-shadow:0 0 0 6px var(--mc)}
.cbook{display:flex;flex-direction:column;align-items:center;gap:12px}
.csvg{width:min(520px,100%);background:#fff;border-radius:18px;overflow:hidden;border-bottom:6px solid var(--edge)}
.csvg svg{display:block;width:100%}
.csvg path{cursor:pointer;transition:fill .15s}
.csvg path.pfill{animation:fillpop .3s}
@keyframes fillpop{50%{opacity:.6}}
.pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
.pc{width:44px;height:44px;border-radius:50%;background:var(--pc);border:3px solid #fff;box-shadow:0 3px 0 var(--edge)}
.pc.on{transform:scale(1.18);box-shadow:0 0 0 3px var(--ink)}
.gthumb{width:220px;max-width:100%;margin:0 auto;border-radius:12px;overflow:hidden;border:3px solid var(--edge)}
.gthumb svg,.gi svg{display:block;width:100%}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gi{background:#fff;border-radius:14px;overflow:hidden;border-bottom:5px solid var(--edge)}

/* pet & trophies */
.petpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.pp{display:flex;flex-direction:column;align-items:center;background:var(--card);border-radius:22px;padding:12px;border-bottom:6px solid var(--edge)}
.pp span{font-family:var(--emo);font-size:3.6rem;line-height:1.1}
.room{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(180deg,#fff7e8 0 68%,#f1d6ae 68%);border-radius:26px;padding:16px 14px 14px;margin-top:8px;border-bottom:6px solid #d9b98a}
.room .hint{color:var(--muted)}
.mood{display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:4px 12px;font-weight:800;box-shadow:0 3px 0 var(--edge)}
.mood span{font-family:var(--emo);font-size:1.5rem}
.petbtn{position:relative;padding:6px 20px}
.pet{position:relative;display:inline-block;line-height:1}
.pet .pb{font-family:var(--emo);font-size:2.6rem;display:block}
.pet.big .pb{font-size:7.5rem}
.pet .pw{position:absolute;font-family:var(--emo);left:50%;transform:translateX(-50%)}
.pet .hat{top:-34%;font-size:55%}
.pet .face{top:24%;font-size:45%}
.pet .item{left:auto;right:-38%;bottom:-2%;transform:none;font-size:42%}
.pet.big .hat{font-size:3.6rem;top:-28%}
.pet.big .face{font-size:3rem;top:22%}
.pet.big .item{font-size:3.2rem}
.pet.jump{animation:petjump .5s}
@keyframes petjump{30%{transform:translateY(-22px) scale(1.06,.94)}60%{transform:translateY(0) scale(.95,1.05)}}
.heart{position:absolute;top:10%;font-family:var(--emo);font-size:1.8rem;pointer-events:none;animation:rise 1s forwards}
.pname{text-align:center}.pname b{font-size:1.4rem;display:block}.pname small{color:var(--muted);font-weight:800}
.bars{display:grid;gap:6px;width:min(360px,100%)}
.bars>div{display:grid;grid-template-columns:125px 1fr;align-items:center;gap:8px;font-weight:800;font-size:.95rem}
.bars .prog{margin:0;height:14px}
.mycar{position:relative}
.hpet .pet .pb{font-size:1.8rem}
.hpet{position:absolute;right:-10px;bottom:-10px;width:48px;height:48px;box-shadow:0 3px 0 var(--edge);border-radius:50%;background:#fff7e8;display:grid;place-items:center}
.hpet i{position:absolute;right:-4px;top:-4px;font-style:normal;font-family:var(--emo);font-size:1.1rem}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:rgba(255,255,255,.65);border-radius:18px;padding:10px 6px;border:3px dashed var(--edgeD)}
.tro span{font-family:var(--emo);font-size:2.2rem;line-height:1.2;filter:grayscale(1);opacity:.6}
.tro small{color:var(--muted);font-weight:700;font-size:.8rem;line-height:1.15}
.tro em{font-style:normal;font-weight:800;font-size:.8rem;color:var(--sunD)}
.tro.on{background:var(--gold);border:3px solid var(--sunD);border-bottom-width:6px}
.tro.on span{filter:none;opacity:1}
.trophyToast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:10px;background:var(--gold);border:3px solid var(--sunD);border-radius:20px;padding:8px 16px;box-shadow:0 6px 0 var(--sunD);animation:drop .5s cubic-bezier(.3,1.6,.6,1);max-width:calc(100% - 32px)}
.trophyToast span{font-family:var(--emo);font-size:2.2rem}
.trophyToast b{display:block}.trophyToast small{font-weight:800;color:var(--sunD)}
@keyframes drop{from{transform:translate(-50%,-120%)}}
.pstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.pstat div{background:var(--sky2);border-radius:14px;padding:8px 4px}
.pstat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.pstat small{color:var(--muted);font-weight:700;font-size:.78rem;line-height:1.1;display:block}
.pchart{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:130px;align-items:end;margin:8px 0 4px}
.pchart div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px}
.pchart i{display:block;width:70%;min-height:3px;background:var(--plum);border-radius:6px 6px 2px 2px}
.pchart b{font-size:.8rem;font-variant-numeric:tabular-nums}.pchart small{font-size:.75rem;color:var(--muted);font-weight:800}
.ph3{margin:14px 0 6px;font-size:1.1rem;text-align:left}
.plist{display:grid;gap:4px;text-align:left}
.plist div{display:grid;grid-template-columns:140px 1fr 32px;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.plist i{display:block;height:10px;border-radius:99px;background:var(--sun)}
.plist b{text-align:right;font-variant-numeric:tabular-nums}
.nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* graphics polish */
.logo{position:relative;display:flex;align-items:baseline;justify-content:center;gap:8px;margin:6px 0 2px;font-weight:800;line-height:1;transform:rotate(-2deg)}
.logo span,.logo b{font-size:2.1rem;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.logo b{color:var(--sun);font-size:2.5rem}
.logo i{font-style:normal;font-family:var(--emo);font-size:1.8rem;animation:wave 1.6s ease-in-out infinite;transform-origin:bottom left}
@keyframes wave{50%{transform:rotate(14deg)}}
.hello{background:linear-gradient(180deg,#e2f3ff 0,#fff 62%);position:relative;overflow:hidden}
.hello .mycar{z-index:1}
.hello::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(90deg,#fff 0 18px,transparent 18px 36px) center/100% 3px no-repeat,var(--road)}
.hello{padding-bottom:22px}
.game{overflow:hidden;isolation:isolate}
.game::before{content:"";position:absolute;inset:0 0 52% 0;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0));border-radius:24px 24px 50% 50%/24px 24px 18px 18px;z-index:-1}
.game::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 85%,rgba(255,255,255,.18) 0 18%,transparent 19%),radial-gradient(circle at 12% 70%,rgba(255,255,255,.12) 0 10%,transparent 11%);z-index:-1}
.game .ge{filter:drop-shadow(0 4px 0 rgba(0,0,0,.18));transition:transform .2s}
.game:hover .ge{transform:translateY(-4px) rotate(-6deg) scale(1.08)}
.gn{text-shadow:0 2px 0 rgba(0,0,0,.2)}
.nav button.on{transform:translateY(-3px)}
.nav button.on{animation:navpop .35s}
@keyframes navpop{50%{transform:translateY(-6px) scale(1.06)}}
.showroom{position:relative;margin-top:12px;border-radius:26px;overflow:hidden;padding:26px 14px 12px;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.35) 0,rgba(255,255,255,0) 55%),linear-gradient(180deg,#2c3a73 0,#1b2550 62%,#3b4453 62%,#2b303b 100%);border-bottom:6px solid #15314d}
.showroom::before{content:"";position:absolute;left:50%;top:-30px;width:70%;height:120%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,246,200,.35),rgba(255,246,200,0) 75%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);pointer-events:none}
.showroom::after{content:"";position:absolute;left:50%;bottom:58px;width:78%;height:34px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#5d6b86 0,#3b4453 70%);box-shadow:0 0 0 4px rgba(255,255,255,.12);z-index:0}
.turn{position:relative;z-index:1;width:min(360px,92%);margin:0 auto;animation:bob 2.6s ease-in-out infinite}
.turn.hop{animation:hop .5s}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hop{40%{transform:translateY(-18px) rotate(-3deg)}70%{transform:translateY(2px)}}
.srfoot{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px;color:#fff}
.srfoot b{font-size:1.25rem}
.srfoot span{display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-block:12px 10px}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;flex:none;background:var(--card);border-radius:999px;padding:6px 14px 6px 8px;font-weight:800;border-bottom:4px solid var(--edge)}
.chip span{font-family:var(--emo);font-size:1.3rem}
.chip.on{background:var(--sun);border-color:var(--sunD)}
.ptsv{width:52px;height:30px;border-radius:8px;border:2px solid var(--ink)}
.sw.glow{box-shadow:0 0 12px 3px var(--g)}
.cheats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.cheats .btn{white-space:normal}
.gatein{font:inherit;font-size:1.6rem;font-weight:800;width:140px;text-align:center;padding:6px;border-radius:14px;border:3px solid var(--edge);margin-top:6px;background:#fff;color:var(--ink)}
.gear{touch-action:none;-webkit-touch-callout:none}

/* crew */
.dotn{font-style:normal;background:var(--tomato);color:#fff;border-radius:99px;padding:0 7px;font-size:.8rem;margin-left:4px}
.seg button{min-width:0;line-height:1.15}
.seg button small{display:block;font-size:.75rem;color:var(--muted)}
.rtag{position:absolute;top:12px;left:12px;background:var(--rc);color:#fff;font-weight:800;font-size:.8rem;border-radius:99px;padding:2px 10px}
.reveal2 .rtag{position:static;display:inline-block}
.room{box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--rc) 35%,transparent)}
.chain{display:flex;align-items:center;gap:6px;font-family:var(--emo);font-size:1.6rem}
.chain span{opacity:.35;filter:grayscale(1)}.chain span.on{opacity:1;filter:none}
.chain i{font-style:normal;font-size:1rem;opacity:.5}
.abil{margin:2px 0;font-weight:800;color:var(--plumD);text-align:center;background:#fff;border-radius:14px;padding:6px 12px}
.crewgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.cc{position:relative;display:flex;flex-direction:column;align-items:center;background:var(--card);border-radius:18px;padding:10px 4px 8px;border:3px solid var(--rc);border-bottom-width:6px}
.cc .ce2{font-family:var(--emo);font-size:2.6rem;line-height:1.15}
.cc b{font-size:.95rem;line-height:1.1;text-align:center}
.cc small{color:var(--muted);font-weight:800;font-size:.8rem}
.cc i{position:absolute;top:-10px;right:-6px;font-style:normal;font-size:.7rem;font-weight:800;background:var(--grass);color:#fff;border-radius:99px;padding:1px 7px}
.cc.on{background:#fff7d6;box-shadow:0 0 0 3px var(--sun)}
.cc.shadow{background:rgba(255,255,255,.55);border-style:dashed}
.cc.shadow .ce2{filter:brightness(0);opacity:.22}
.pp small{color:var(--muted);font-weight:700;font-size:.78rem;text-align:center;line-height:1.15}
.eggs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.eggslot{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border-radius:18px;padding:10px;border-bottom:5px solid var(--edge)}
.eggslot .prog{width:100%;margin:0}
.eggslot small{color:var(--muted);font-weight:800}
.eggslot.ready{background:#fff7d6;animation:pulse 1.2s infinite}
.egg{font-family:var(--emo);font-size:2.8rem;line-height:1.1;display:inline-block}
.egg.gold{filter:sepia(1) saturate(6) hue-rotate(5deg) brightness(1.05);}
.eggslot.ready .egg{animation:eggwob 1s infinite}
@keyframes eggwob{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(0)}}
.hatch{position:relative;height:130px;display:grid;place-items:center}
.hatch::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--rc),transparent 70%);opacity:0;animation:glowin .6s 1.1s forwards}
.hatch .egg{position:absolute;font-size:5rem;animation:hatchwob 1.2s forwards}
.hatch .born{position:absolute;font-family:var(--emo);font-size:5.5rem;opacity:0;transform:scale(.2);animation:born .6s 1.15s forwards}
@keyframes hatchwob{0%,100%{transform:rotate(0)}15%{transform:rotate(-15deg)}30%{transform:rotate(15deg)}45%{transform:rotate(-18deg)}60%{transform:rotate(18deg)}80%{transform:scale(1.3);opacity:1}95%{transform:scale(1.6);opacity:0}}
@keyframes born{to{opacity:1;transform:scale(1)}}
@keyframes glowin{to{opacity:.6}}
.reveal2{opacity:0;animation:fadein .4s 1.3s forwards}
@keyframes fadein{to{opacity:1}}
.evo{position:relative;height:130px;display:grid;place-items:center;font-family:var(--emo)}
.evo .from{position:absolute;font-size:5rem;animation:evofrom 1.5s forwards}
.evo .to{position:absolute;font-size:5.5rem;opacity:0;animation:born .5s 1.4s forwards}
@keyframes evofrom{0%{filter:brightness(1)}30%{transform:scale(1.1);filter:brightness(3)}50%{transform:scale(.9)}70%{transform:scale(1.2);filter:brightness(5)}90%{opacity:1}100%{opacity:0;transform:scale(1.5);filter:brightness(8)}}
.gone{visibility:hidden}
.crewline{color:var(--plumD)!important;font-weight:800}

/* sticker tiers & trader */
button.slot{font:inherit}
.slot.got.t1{background:linear-gradient(135deg,#ffffff,#d5dbe4 60%,#f4f6fa);border-color:#9aa3b2}
.slot.got.t2{background:linear-gradient(135deg,#fff3c4,#ffc533 60%,#ffe28a);border-color:#d99a00}
.slot.got.t3{background:linear-gradient(#fff,#fff) padding-box,conic-gradient(#ff4d4d,#ffd23f,#2ec27e,#3a86ff,#9b5de5,#ff4d4d) border-box;border:4px solid transparent;animation:shimmer 2s linear infinite}
@keyframes shimmer{50%{filter:brightness(1.12) saturate(1.3)}}
.slot em{position:absolute;left:-6px;top:-6px;font-style:normal;font-family:var(--f);font-size:.75rem;font-weight:800;background:var(--grass);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;animation:pulse 1s infinite}
.page.locked{opacity:.65;border-style:dashed}
.page.pt1{border-bottom-color:#9aa3b2}.page.pt2{border-bottom-color:var(--sunD);background:#fffbea}.page.pt3{background:linear-gradient(135deg,#fff5fb,#f2fbff)}
.seas{background:var(--orange);color:#fff;border-radius:99px;padding:0 8px;font-size:.7rem;vertical-align:middle}
.bigstk{width:120px;height:120px;margin:0 auto;border-radius:26px;display:grid;place-items:center;font-family:var(--emo);font-size:4.6rem;background:#fff;border:4px solid var(--edge)}
.bigstk.t1{background:linear-gradient(135deg,#ffffff,#d5dbe4 60%,#f4f6fa);border-color:#9aa3b2}
.bigstk.t2{background:linear-gradient(135deg,#fff3c4,#ffc533 60%,#ffe28a);border-color:#d99a00}
.bigstk.t3{background:linear-gradient(#fff,#fff) padding-box,conic-gradient(#ff4d4d,#ffd23f,#2ec27e,#3a86ff,#9b5de5,#ff4d4d) border-box;border:6px solid transparent;animation:shimmer 2s linear infinite}
.tierrow{display:flex;justify-content:center;gap:10px;font-family:var(--emo);font-size:1.8rem}
.tierrow span{filter:grayscale(1);opacity:.35}.tierrow span.on{filter:none;opacity:1}
.trader{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,#fff7e8,#ffe9c7);border-radius:24px;padding:14px;margin-top:12px;border-bottom:6px solid #d9b98a}
.tface{font-family:var(--emo);font-size:3.2rem;line-height:1;animation:drive 3s ease-in-out infinite}
.tbody{flex:1;min-width:0}.tbody>b{font-size:1.2rem}.tbody p{margin:2px 0 8px;font-weight:600;color:var(--muted);font-size:.95rem}
.toffers{display:grid;gap:8px}
.toff{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:8px 12px;border-bottom:4px solid #d9b98a;text-align:left;font-weight:800}
.toff:active{transform:translateY(2px)}
.toff i{font-style:normal;color:var(--muted)}
.tgive{background:var(--sky2);border-radius:10px;padding:2px 8px;white-space:nowrap}
.tget{display:flex;align-items:center;gap:6px}.tget em{font-style:normal;font-family:var(--emo);font-size:1.4rem}
.toff small{grid-column:1/-1;color:var(--grassD);font-size:.8rem}
.toff.used{opacity:.55}.toff.poor{opacity:.7}
.seas.off{background:var(--muted)}
.nextseas{display:block;font-weight:800;color:var(--orangeD);margin-top:2px}
.seasonnote{background:#fff3e0;border-radius:16px;padding:8px 12px;font-weight:700;margin:0 0 10px;border-bottom:4px solid #f0c89a}

/* expeditions, bingo, board */
.cc i.away{background:var(--blue)}
.exps,.dests{display:grid;gap:10px}
.expcard,.dest{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 12px;border-bottom:5px solid var(--edge)}
.expcard>div,.dest>div{flex:1;min-width:0}
.expcard b,.dest b{display:block}
.expcard small,.dest small{display:block;color:var(--muted);font-weight:700;font-size:.82rem}
.expcard .prog{margin:4px 0}
.expcard.done{background:#fff7d6;animation:pulse 1.4s infinite}
.dest.locked{opacity:.6}
.xe{font-family:var(--emo);font-size:2.2rem;width:52px;height:52px;display:grid;place-items:center;background:var(--sky2);border-radius:14px;flex:none}
.bingo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:460px;margin:0 auto}
.bc{position:relative;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);border-radius:16px;padding:6px;text-align:center;border-bottom:5px solid var(--edge)}
.bc span{font-family:var(--emo);font-size:1.8rem;line-height:1.1}
.bc small{font-weight:700;font-size:.72rem;line-height:1.1;color:var(--muted)}
.bc em{font-style:normal;font-weight:800;font-size:.8rem}
.bc i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:3rem;color:rgba(47,178,87,.85);font-weight:800}
.bc.ok{background:#e2f8e8;border-color:var(--grass)}
.bc.line{background:#fff3c4;border-color:var(--sunD)}
.bgs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.board2{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:20px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 0 var(--edge);touch-action:none;cursor:crosshair}
.bi{position:absolute;font-family:var(--emo);line-height:1;cursor:grab;user-select:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.bi.sel{outline:3px dashed var(--sun);outline-offset:4px;border-radius:8px}
.bempty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;font-weight:800;color:rgba(21,49,77,.6);margin:0;pointer-events:none}
.btools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.btray{display:flex;flex-wrap:wrap;gap:6px}
.bts{width:48px;height:48px;font-family:var(--emo);font-size:1.7rem;background:var(--card);border-radius:12px;border-bottom:4px solid var(--edge)}
.bts.on{background:var(--sun);box-shadow:0 0 0 3px var(--sunD)}
.xcode{display:block;width:100%;min-height:80px;font:600 .8rem/1.3 ui-monospace,Menlo,Consolas,monospace;padding:8px;border-radius:12px;border:3px solid var(--edge);background:#fff;color:var(--ink);resize:vertical;word-break:break-all;user-select:text;-webkit-user-select:text}
.xok{background:#fff3e0;border-radius:14px;padding:8px 12px;margin-top:8px}
.xerr{color:var(--tomatoD);font-weight:800}

 v.innerHTML=gHead('Hudobná garáž',`<span class="gstat">🎵 <b id="ml">0</b></span><span class="gstat" id="mh">❤️❤️</span>`)+`<div class="music"><p class="lq" id="mq">Autíčka zahrajú melódiu. Zopakuj ju!</p><div class="mcars">${COL.map((c,i)=>`<button class="mcar" data-m="${i}" style="--mc:${c[0]}" aria-label="Auto">${carSVG(c[0])}</button>`).join('')}</div><div class="mrow"><button class="btn sun" id="mstart">▶ Začať</button></div></div>`;
 say('Autíčka zahrajú melódiu. Pozeraj a počúvaj, potom ju zopakuj.');
 const btns=[...v.querySelectorAll('.mcar')];
 const flash=i=>{const b=btns[i];b.classList.add('on');tone(COL[i][1],.35,'square',.09);setTimeout(()=>b.classList.remove('on'),320)};
 function play(){busy=true;inp=0;MQ('Počúvaj…');seqA.forEach((n,i)=>setTimeout(()=>{if(!(G&&G.done))flash(n)},500+i*650));setTimeout(()=>{busy=false;MQ('Teraz ty!')},500+seqA.length*650)}
 $('#mstart').onclick=()=>{$('#mstart').parentNode.remove();seqA=[R(0,3),R(0,3)];play()};
 btns.forEach((b,i)=>b.onclick=()=>{if(busy)return;flash(i);
  if(seqA[inp]===i){inp++;if(inp===seqA.length){best=seqA.length;gst().best.music=Math.max(gst().best.music||0,best);{const e=$('#ml');if(e)e.textContent=best}busy=true;MQ('Výborne! Ďalšia, dlhšia…');setTimeout(()=>sfx.ok(),350);seqA.push(R(0,3));setTimeout(play,1300)}}
  else{lives--;txt('#mh','❤️'.repeat(lives)+'🖤'.repeat(2-lives));sfx.bad();busy=true;
   if(lives>0){MQ('Ups! Ešte raz to isté.');say('Ups! Skús to ešte raz.');setTimeout(play,1300)}
   else{const s=best>=6?3:best>=4?2:1;setTimeout(()=>finish('music',10+best*5,s,8+best*2,`<p>Zapamätal si si ${best} tónov!</p>`),600)}}});
 G={stop(){}}};

 {n:'Raketa vo vesmíre',e:'🚀',r:['M0 0 H300 V220 H0 Z','M210 62 a30 30 0 1 0 60 0 a30 30 0 1 0 -60 0','M196 70 Q240 44 286 56 L285 62 Q240 52 198 76 Z','M36 40 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0',starPath(70,150,14,6),starPath(150,32,11,5),starPath(268,172,13,5),starPath(30,100,8,3.5),'M136 192 Q150 222 164 192 Z','M130 150 L108 198 L130 192 Z','M170 150 L192 198 L170 192 Z','M130 192 L130 100 Q150 52 170 100 L170 192 Z','M131 100 Q150 52 169 100 Z','M138 124 a12 12 0 1 0 24 0 a12 12 0 1 0 -24 0']},
 {n:'Traktor na farme',e:'🚜',r:['M0 0 H300 V150 H0 Z','M20 40 a20 20 0 1 0 40 0 a20 20 0 1 0 -40 0','M240 30 q0 -12 12 -12 q6 -10 18 -6 q12 -2 14 10 q10 2 8 10 Z','M0 140 Q80 92 160 134 Q230 98 300 128 V220 H0 Z','M0 172 H300 V220 H0 Z','M190 92 H280 V172 H190 Z','M182 94 L235 56 L288 94 Z','M220 128 H250 V172 H220 Z','M118 142 H124 V164 H118 Z','M40 184 L40 142 L82 142 L86 162 L142 164 L142 184 Z','M46 148 L46 160 L78 160 L76 148 Z','M40 186 a22 22 0 1 0 44 0 a22 22 0 1 0 -44 0','M118 194 a13 13 0 1 0 26 0 a13 13 0 1 0 -26 0']}];
const picSVG=(p,f)=>`<svg viewBox="0 0 300 220" aria-hidden="true">${PICS[p].r.map((d,i)=>`<path d="${d}" fill="${f[i]||'#ffffff'}" stroke="#15314d" stroke-width="2.5" stroke-linejoin="round"/>`).join('')}</svg>`;
GAMEFN.color=v=>chooser(v,'Omaľovánka',PICS.map((p,i)=>({e:p.e,n:p.n,s:p.r.length+' častí',c:20,k:i})),'Vyber si obrázok na vymaľovanie.',o=>{
 const P=PICS[o.k],fills=P.r.map(()=>'#ffffff'),PAL=['#ff4d4d','#ff8c1a','#ffd23f','#2ec27e','#1f8a41','#7fd0ff','#3a86ff','#9b5de5','#ff6fb5','#8b5a2b','#f4f6fa','#9aa3b2','#2a2d36'];let cur=PAL[0];
 v.className='gameview scroll';
 v.innerHTML=gHead('Omaľovánka')+`<div class="cbook"><div class="csvg" id="cs">${P.r.map((d,i)=>'').join('')}${picSVG(o.k,fills)}</div><div class="pal">${PAL.map((c,i)=>`<button class="pc ${i?'':'on'}" data-c="${c}" style="--pc:${c}" aria-label="Farba"></button>`).join('')}</div><div class="mrow"><button class="btn grass" id="cdone">✔ Hotovo, ulož do albumu</button></div></div>`;
 say('Vyber si farbu a ťukni na obrázok.');
 v.querySelectorAll('.pc').forEach(b=>b.onclick=()=>{cur=b.dataset.c;v.querySelectorAll('.pc').forEach(q=>q.classList.toggle('on',q===b));tone(500+PAL.indexOf(cur)*40,.06,'triangle',.06)});
 v.querySelectorAll('#cs path').forEach((p,i)=>p.onclick=()=>{fills[i]=cur;p.setAttribute('fill',cur);p.classList.remove('pfill');void p.getBoundingClientRect();p.classList.add('pfill');tone(400+R(0,6)*60,.08,'sine',.07)});
 $('#cdone').onclick=()=>{const n=fills.filter(f=>f!=='#ffffff').length,ratio=n/fills.length;if(ratio<.3){toast('Vymaľuj ešte trochu viac!');say('Vymaľuj ešte trochu viac.');return}
  S.gallery=[{p:o.k,f:fills.slice()},...(S.gallery||[])].slice(0,12);save();const s=ratio>=1?3:ratio>=.7?2:1;finish('color',o.c*(.5+ratio/2),s,10,`<div class="gthumb">${picSVG(o.k,fills)}</div><p>Obrázok je v Albume.</p>`)};
 G={stop(){}}});

/* ---------- hidden test menu (long-press ⚙️ for 3 s, then a parent math question) ---------- */
let gearT=null,gearLong=false;
(()=>{const g=document.querySelector('.gear');const start=()=>{gearLong=false;clearTimeout(gearT);gearT=setTimeout(()=>{gearLong=true;cheatGate()},3000)};const stop=()=>clearTimeout(gearT);
 g.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>g.addEventListener(ev,stop));g.addEventListener('contextmenu',e=>e.preventDefault())})();
let gateAns=0;
function cheatGate(){const a=R(6,9),b=R(6,9);gateAns=a*b;tone(300,.1,'square',.05);
 modal(`<h2>Pre rodičov</h2><p>Koľko je ${a} × ${b}?</p><input id="gateIn" class="gatein" type="number" inputmode="numeric" autocomplete="off" aria-label="Výsledok"><div class="mrow"><button class="btn ghost" data-act="close">Zrušiť</button><button class="btn grass" data-act="gateok">OK</button></div>`);setTimeout(()=>$('#gateIn')?.focus(),50)}
ACT.gateok=()=>{if(+($('#gateIn')?.value)===gateAns)ACT.cheats();else{closeModal();toast('Nesprávne.')}};
ACT.cheats=()=>modal(`<h2>Testovacie menu</h2><p class="small">Skryté pred dieťaťom. Zmeny sa hneď uložia.</p><div class="cheats">
 <button class="btn sun sm" data-cheat="c1k">+1 000 🪙</button><button class="btn sun sm" data-cheat="c10k">+10 000 🪙</button><button class="btn sun sm" data-cheat="c100k">+100 000 🪙</button>
 <button class="btn sun sm" data-cheat="stars">+10 ⭐</button><button class="btn plum sm" data-cheat="lvl">+1 level</button><button class="btn plum sm" data-cheat="lvl20">Level 20</button>
 <button class="btn grass sm" data-cheat="cars">Všetky autá</button><button class="btn grass sm" data-cheat="tracks">Všetky trate</button><button class="btn grass sm" data-cheat="tune">Celý tuning</button>
 <button class="btn grass sm" data-cheat="ups">Vylepšenia na max</button><button class="btn grass sm" data-cheat="city">Mesto na max</button><button class="btn grass sm" data-cheat="fill">Naplniť mince v meste</button>
 <button class="btn grass sm" data-cheat="album">Celé album</button><button class="btn grass sm" data-cheat="quests">Splniť úlohy</button><button class="btn grass sm" data-cheat="gift">Denný darček znova</button>
 <button class="btn grass sm" data-cheat="pet">Nakŕmiť kamaráta</button><button class="btn plum sm" data-cheat="candy">+50 🍬</button><button class="btn plum sm" data-cheat="eggs">+3 vajíčka</button><button class="btn plum sm" data-cheat="hatchnow">Vajíčka hneď pripravené</button><button class="btn plum sm" data-cheat="crewlv">Kamarát +1 level</button><button class="btn plum sm" data-cheat="crewall">Všetci kamaráti</button><button class="btn plum sm" data-cheat="expnow">Výpravy hneď hotové</button><button class="btn plum sm" data-cheat="bingo">Splniť bingo</button><button class="btn grass sm" data-cheat="hungry">Hladný kamarát</button><button class="btn ${S.cheatShort?'tomato':'ghost'} sm" data-cheat="short">Krátke preteky: ${S.cheatShort?'zapnuté':'vypnuté'}</button>
 </div><div class="mrow"><button class="btn ghost" data-act="close">Zavrieť</button></div>`);
function cheat(k){const all=a=>a.map(x=>x[0]);
 ({c1k:()=>S.coins+=1000,c10k:()=>S.coins+=10000,c100k:()=>S.coins+=100000,stars:()=>{S.stars+=10;S.chest+=10},
  lvl:()=>{S.lvl++;S.xp=0},lvl20:()=>{S.lvl=Math.max(S.lvl,20);S.xp=0},
  cars:()=>{S.cars=CARS.map(c=>c.e)},tracks:()=>{S.tracks=TRACKS.map(t=>t.id)},
  tune:()=>{Object.keys(TUNE).forEach(c=>S.tOwn[c]=all(TUNE[c].items))},
  ups:()=>UPS.forEach(u=>S.up[u.id]=u.max),
  city:()=>{S.lvl=Math.max(S.lvl,14);BLDS.forEach(b=>{S.bld[b.id]=10;S.bt[b.id]=S.bt[b.id]||Date.now()})},
  fill:()=>BLDS.forEach(b=>{if(bL(b.id))S.bt[b.id]=Date.now()-3*36e5}),
  album:()=>{PAGES.forEach(p=>p.s.forEach(x=>S.stk[x]=Math.max(1,S.stk[x]||0)));checkPages()},
  quests:()=>S.quests.forEach(q=>q.have=q.goal),gift:()=>{S.gift=''},
  pet:()=>{const p=act();if(p){p.food=100;p.joy=100;p.t=Date.now()}},hungry:()=>{const p=act();if(p){p.food=10;p.joy=10;p.t=Date.now()}},candy:()=>{S.candy+=50},eggs:()=>{giveEgg('n');giveEgg('g');giveEgg('n')},hatchnow:()=>(S.eggs||[]).forEach(e=>e.p=99),expnow:()=>(S.exp||[]).forEach(x=>x.start=Date.now()-x.dur),bingo:()=>{if(S.bingo)S.bingo.cells.forEach(c=>{if(c.have<c.goal)bingoTrack(c.k,c.goal)})},crewall:()=>{LINES.forEach(L=>{if(!S.crew.find(c=>c.sp===L.id)){S.crew.push(newCrew(L.id));S.dex[L.id]=0}})},crewlv:()=>{const p=act();if(p)crewXP(p,crewNeed(p.lv))},
  short:()=>{S.cheatShort=!S.cheatShort}})[k]();
 hud();save();sfx.ok();toast('Hotovo ✔');ACT.cheats()}
/* ---------- save transfer (export / import) ---------- */
function exportCode(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}const b=new TextEncoder().encode(JSON.stringify(S));let bin='';b.forEach(c=>bin+=String.fromCharCode(c));return'AM1:'+btoa(bin)}
function parseCode(t){t=(t||'').trim().replace(/\s+/g,'');if(!t.startsWith('AM1:'))throw 0;const bin=atob(t.slice(4)),b=Uint8Array.from(bin,c=>c.charCodeAt(0)),d=JSON.parse(new TextDecoder().decode(b));if(typeof d!=='object'||typeof d.coins!=='number')throw 0;return d}
let pendingImport=null;
ACT.xfer=()=>modal(`<h2>Preniesť postup</h2><p class="small">Postup sa ukladá len v tomto prehliadači. Ak chceš hrať na inej adrese alebo zariadení, skopíruj tu kód a vlož ho tam.</p>
 <h3 class="ph3">1. Skopírovať tento postup</h3><textarea id="xout" class="xcode" readonly aria-label="Kód postupu">${exportCode()}</textarea><div class="mrow" style="margin-top:6px"><button class="btn sun sm" data-act="xcopy">📋 Kopírovať kód</button></div>
 <h3 class="ph3">2. Vložiť postup z inej hry</h3><textarea id="xin" class="xcode" placeholder="Sem vlož kód, ktorý začína AM1:" aria-label="Vložiť kód"></textarea><div class="mrow" style="margin-top:6px"><button class="btn plum sm" data-act="xcheck">📥 Načítať kód</button></div><div id="xmsg"></div>
 <div class="mrow"><button class="btn ghost" data-act="settings">Späť</button></div>`);
ACT.xcopy=()=>{const t=$('#xout');const done=()=>toast('Kód je skopírovaný.');const fb=()=>{t.focus();t.select();toast('Kód je označený. Skopíruj ho (Ctrl+C alebo podrž prst).')};try{navigator.clipboard.writeText(t.value).then(done,fb)}catch(e){fb()}};
ACT.xcheck=()=>{const m=$('#xmsg');try{pendingImport=parseCode($('#xin').value);const d=pendingImport;m.innerHTML=`<div class="xok"><p>Našiel som postup: <b>level ${d.lvl||1}</b>, <b>${fmt(d.coins)} 🪙</b>, áut: <b>${(d.cars||[]).length}</b>, kamarátov: <b>${(d.crew||[]).length||(d.pet?1:0)}</b>.</p><p><b>Terajší postup v tomto prehliadači sa nahradí.</b></p><div class="mrow"><button class="btn tomato sm" data-act="ximport">Áno, nahradiť</button></div></div>`}catch(e){pendingImport=null;m.innerHTML='<p class="xerr">Kód sa nedá načítať. Skontroluj, či si skopíroval celý kód od AM1: až po koniec.</p>'}};
ACT.ximport=()=>{if(!pendingImport)return;S=Object.assign(DEF(),pendingImport);pendingImport=null;migrateCrew();Object.keys(TUNE).forEach(k=>{S.tOwn[k]=S.tOwn[k]||[TUNE[k].items[0][0]]});try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}closeModal();hud();applySky();show('games');sfx.win();toast('Postup je prenesený ✔')};
/* ---------- boot ---------- */
function start(d){S=d&&d.S?Object.assign(DEF(),d.S):load();migrateCrew();Object.keys(TUNE).forEach(k=>{S.tOwn[k]=S.tOwn[k]||[TUNE[k].items[0][0]]});applySky();setInterval(applySky,60000);fillQuests();hud();show('games')}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
