<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe4ff" />
    <title>Autíčkové mesto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/city.css" />
    <link rel="stylesheet" href="css/shop-album.css" />
    <link rel="stylesheet" href="css/ui.css" />
    <link rel="stylesheet" href="css/games.css" />
    <link rel="stylesheet" href="css/games-more.css" />
    <link rel="stylesheet" href="css/pet-trophies.css" />
    <link rel="stylesheet" href="css/polish.css" />
    <link rel="stylesheet" href="css/crew.css" />
    <link rel="stylesheet" href="css/album.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <button class="lvl" data-act="lvl" aria-label="Level">
          <span class="lvlN" id="lvlN">1</span><span class="xp"><i id="xpF"></i></span>
        </button>
        <div class="pill" id="coinP"><span style="font-family: var(--emo)">🪙</span> <b id="coinN">0</b></div>
        <div class="pill" id="starP"><span style="font-family: var(--emo)">⭐</span> <b id="starN">0</b></div>
        <button class="gear" data-act="settings" aria-label="Nastavenia">⚙️</button>
      </header>
      <main id="view"></main>
      <nav class="nav" id="nav">
        <button data-tab="games">🎮<span>Hry</span></button>
        <button data-tab="city">🏙️<span>Mesto</span></button>
        <button data-tab="shop">🛒<span>Obchod</span></button>
        <button data-tab="album">📒<span>Album</span></button>
        <button data-tab="pet">🐾<span>Kamaráti</span></button>
      </nav>
    </div>
    <div id="modal" hidden></div>
    <canvas id="fx"></canvas>

    <!-- Classic scripts share one global scope and must load in this order. -->
    <script src="js/util.js"></script>
    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/render/car-side.js"></script>
    <script src="js/render/car-top.js"></script>
    <script src="js/core.js"></script>
    <script src="js/screens/city.js"></script>
    <script src="js/screens/views.js"></script>
    <script src="js/screens/album.js"></script>
    <script src="js/actions.js"></script>
    <script src="js/screens/trophies.js"></script>
    <script src="js/screens/crew.js"></script>
    <script src="js/screens/crew-view.js"></script>
    <script src="js/screens/parents.js"></script>
    <script src="js/screens/album-extras.js"></script>
    <script src="js/games/framework.js"></script>
    <script src="js/games/race.js"></script>
    <script src="js/games/pexeso.js"></script>
    <script src="js/games/wash.js"></script>
    <script src="js/games/count.js"></script>
    <script src="js/games/puzzle.js"></script>
    <script src="js/games/park.js"></script>
    <script src="js/games/repair.js"></script>
    <script src="js/games/maze.js"></script>
    <script src="js/games/traffic.js"></script>
    <script src="js/games/letters.js"></script>
    <script src="js/games/music.js"></script>
    <script src="js/games/coloring.js"></script>
    <script src="js/cheats.js"></script>
    <script src="js/save-transfer.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
